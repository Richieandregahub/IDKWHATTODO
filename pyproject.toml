[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-cli"
version = "0.2.0"
description = "arena.ai but it lives in your terminal - battle mode, agent mode, direct chat"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Richieandregahub" }]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.scripts]
arena = "arena_cli.main:main"

[tool.setuptools.packages.find]
include = ["arena_cli*"]
